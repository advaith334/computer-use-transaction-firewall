[project]
name = "observ"
version = "0.1.0"
description = "Observ: a transaction firewall for computer-use agents (proof of concept)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "pydantic>=2",
    "python-multipart",
    "pyyaml",
    "typer",
    "uvicorn",
]

[project.optional-dependencies]
browser = ["playwright"]
egress = ["mitmproxy>=11"]

[project.scripts]
observ = "observ.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "playwright", "mitmproxy>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
